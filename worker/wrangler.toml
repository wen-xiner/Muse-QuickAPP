name = "muse-emotion-api-proxy"
main = "index.js"
compatibility_date = "2025-01-01"

# 环境变量 — 部署后在 Cloudflare Dashboard 设置实际值
# 或通过命令: wrangler secret put DEEPSEEK_API_KEY
# 或通过命令: wrangler secret put ACCESS_TOKEN
[vars]
# ACCESS_TOKEN = "your-random-token-here"  # 建议用 wrangler secret 代替明文

[observability]
enabled = true
